# GitHub Actions CI for SPARTA (GitHub variant of .gitlab-ci.yml)
#
# `mvn verify` builds the Tycho/Eclipse-plugin reactor plus the standalone
# plain-Java modules, runs the tests, and produces the packaged artifacts.
# The first run resolves a full Eclipse p2 target platform, so it is slow and
# downloads a lot; the ~/.m2 cache speeds subsequent runs up.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # -Declipse.p2.mirrors=false: download p2 artifacts straight from the canonical
  # Eclipse repo instead of the mirror redirector (www.eclipse.org/downloads/
  # download.php), which rate-limits CI (HTTP 429) and floods the log with retries.
  MAVEN_CLI_OPTS: --batch-mode --errors --show-version --no-transfer-progress -Declipse.p2.mirrors=false

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold p2 cache resolves the full Eclipse target platform, so allow
    # headroom over the normal build time while still cutting off a hung run
    # long before the 6-hour default.
    timeout-minutes: 60
    permissions:
      contents: read    # checkout only
      checks: write     # dorny/test-reporter creates a check run for the test report
    steps:
      # Third-party and GitHub-owned actions are pinned to full commit SHAs
      # (supply-chain hardening: tags are mutable, SHAs are not). Dependabot
      # keeps the pins fresh via the trailing version comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The KU Leuven GitLab Maven registry referenced by the root pom is
      # anonymously readable, so no settings.xml / credentials are needed here.
      - name: Build, test and package
        run: mvn $MAVEN_CLI_OPTS verify

      # Surface test results in the run summary / PR checks.
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Test results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit

      # Ephemeral, browsable-from-the-run build outputs (see notes in chat:
      # this is the "workflow artifact", distinct from release assets).
      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: packages
          path: |
            **/target/*.jar
            releng/**/target/*.zip
            releng/**/target/products/*.zip
            standalone/**/target/*-shaded.jar
          if-no-files-found: warn
          retention-days: 14

      # Per-module JaCoCo coverage reports (XML + HTML), produced by the
      # jacoco-maven-plugin wired into both build halves (tycho-surefire via
      # tycho.testArgLine, plain surefire via argLine). Measurement only --
      # no external coverage service, no gates.
      - name: Upload coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: jacoco-coverage
          path: '**/target/site/jacoco/**'
          if-no-files-found: warn
          retention-days: 14
