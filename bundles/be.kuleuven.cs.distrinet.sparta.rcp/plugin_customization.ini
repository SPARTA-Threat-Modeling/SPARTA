org.eclipse.ui/SHOW_PROGRESS_ON_STARTUP = true
# p2 automatic update checking: enabled, but on a weekly schedule rather than on
# every startup (the previous on-startup default contacted the update sites on every
# launch). The scheduler checks the configured update sites once a week and notifies
# the user; the reminder then re-notifies every 4 hours until acted on. Users can
# change or disable this under Preferences > Install/Update > Automatic Updates.
# (schedule=on-fuzzy-schedule with fuzzy_recurrence is how the p2 scheduler expresses
# a periodic "Once a day/week/month" check.)
org.eclipse.equinox.p2.ui.sdk.scheduler/enabled=true
org.eclipse.equinox.p2.ui.sdk.scheduler/schedule=on-fuzzy-schedule
org.eclipse.equinox.p2.ui.sdk.scheduler/fuzzy_recurrence=Once a week
org.eclipse.equinox.p2.ui.sdk.scheduler/remindOnSchedule=true
org.eclipse.equinox.p2.ui.sdk.scheduler/remindElapsedTime=4 Hours
org.eclipse.ui.ide/SHOW_LOCATION_NAME=false
org.eclipse.ui/defaultPerspectiveId=be.kuleuven.cs.distrinet.sparta.rcp.spartaperspective
