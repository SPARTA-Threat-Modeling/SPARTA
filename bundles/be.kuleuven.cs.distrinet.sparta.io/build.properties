source.. = src/
output.. = target/classes/
# templates/ now lives under src/ so it is copied to the output (target/classes)
# and thus on the classpath for a plain (non-OSGi) launch too - e.g. running the
# standalone CLI from Eclipse. The '.' entry (the src output) carries it into the
# bundle jar, so no separate templates/ include is needed.
bin.includes = META-INF/,\
               .
